substitutions:
  name: shelly-wall-dimmer
  friendly_name: "Wall Dimmer"
  fw_version: "pinmap"
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project: {name: "sam.shelly_wall_dimmer", version: "${fw_version}"}
external_components:
  - source: {type: local, path: ../components}
    components: [shelly_wall_dimmer]
esp32:
  board: esp32dev
  framework: {type: esp-idf}
uart:
  id: dimmer_uart
  rx_pin: GPIO22
  baud_rate: 115200
shelly_wall_dimmer:
  id: dimmer_coprocessor
  silent: true
binary_sensor:
  - platform: gpio
    pin: {number: GPIO13, mode: {input: true, pullup: true}}
    name: "probe GPIO13"
    internal: true
    on_state:
      - logger.log: {format: "PROBE  GPIO13 -> %s", args: ['x ? "HIGH" : "LOW"']}
  - platform: gpio
    pin: {number: GPIO14, mode: {input: true, pullup: true}}
    name: "probe GPIO14"
    internal: true
    on_state:
