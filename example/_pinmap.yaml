wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {ssid: "${friendly_name} Bench", password: !secret ap_password}
captive_portal:
api:
  encryption: {key: !secret encryption_key}
ota:
  - platform: esphome
    password: !secret ota_password
logger:
  level: DEBUG
