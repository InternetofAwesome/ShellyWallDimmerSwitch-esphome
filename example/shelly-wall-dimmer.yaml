# Example device config for the Shelly Plus Wall Dimmer custom firmware.
# Validate with (do NOT `esphome compile` -- that pulls a multi-GB toolchain):
#   source /home/sam/shelly/esphome-venv/bin/activate
#   esphome config example/shelly-wall-dimmer.yaml

substitutions:
  name: shelly-wall-dimmer
  friendly_name: "Wall Dimmer"
  # Per-build version. Stock's OTA updater gates on esp_app_desc.version in the
  # APP IMAGE ("same version: %.*s" in shelly_update.cpp), NOT on manifest.json
  # (proven: a unique manifest version was ignored). If it doesn't change
  # build-to-build, stock downloads the zip and silently discards it.
  #
  # ESPHome's `project: version:` alone does NOT reach that field -- it only
  # emits a C++ define, leaving app_desc carrying ESPHome's own release number,
  # identical every build. When `bridge_package:` is configured, the component
  # wires this value through to IDF's CONFIG_APP_PROJECT_VER so it actually
  # lands in the image. Bump it for each bridge push (a timestamp works); note
  # that changing it rewrites sdkconfig and so forces a full rebuild.
  fw_version: "0.0.0-dev"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Owning project.version makes esp_app_desc.version = ${fw_version} instead of
  # ESPHome's own framework version ("2026.6.5", identical every build). Also
  # shows in `esphome logs` boot banner so the RUNNING build is unambiguous.
  project:
    name: "sam.shelly_wall_dimmer"
    version: "${fw_version}"

external_components:
  # PINNED TO A RELEASE TAG. A tag is immutable, so builds are reproducible and
  # a push to master can never change what your wall switch runs. Bump this
  # deliberately when you want a new version.
  #
  # To track development instead, use `ref: master` with `refresh: 0s` (always
  # re-fetch). For offline/local work against a checkout, swap the whole source
  # for {type: local, path: ../components}.
  - source:
      type: git
      url: https://github.com/InternetofAwesome/ShellyWallDimmerSwitch-esphome
      # NOTE: no release tag is published yet. Until one is, this line will
      # fail to resolve -- deliberately. A hard fetch error is the right
      # outcome for an unreleased project; silently installing the tip of
      # master onto a mains device is not. See "Releases and stability".
      ref: v1.0.0-alpha-01
    refresh: 1d
    components: [shelly_wall_dimmer, status_led_pwm]

esp32:
  # Generic classic-ESP32 dev board (4 MB flash). `esp32dev` is the recognized
  # PlatformIO board for a plain ESP32 -- prefer it over the bare `esp32` option
  # (which ESPHome flags as an unknown board). The device is a classic dual-core
  # ESP32 rev3.1 (an earlier note here claimed a single-core U4WDH -- wrong; the
  # chip reports 2 cores). We force single-core operation via
  # CONFIG_FREERTOS_UNICORE in the component to match Shelly's stock build.
  board: esp32dev
  # REQUIRED for bridge_package (below): that feature hooks a PlatformIO
  # post-build script. As of ESPHome 2026.7.0 the esp32 platform's DEFAULT
  # build backend switched to ESPHome's own native ESP-IDF driver, which never
  # generates a platformio.ini and silently never runs that hook -- the package
  # just never gets built, no error. `toolchain: platformio` opts back into the
  # PlatformIO-driven build ("continue to build exactly as they did before",
  # per the 2026.7.0 release notes); everything else about the build is
  # unaffected. The component also catches a missing `toolchain: platformio`
  # at config-validate time if bridge_package is configured without it.
  toolchain: platformio
  framework:
    type: esp-idf
    # Use ESPHome's RECOMMENDED ESP-IDF (currently 5.5.x) -- no version pin.
    # We first pinned 5.1.6 (the IDF our boot-compat playground used), but
    # ESPHome 2026.6.5's OWN components (esp32/crash_handler.cpp) include
    # headers that moved in newer IDF (xtensa_context.h) and fail to compile on
    # 5.1. The esp_image format is stable 5.1->5.5, so a 5.5 app should boot
    # under the device's stock (IDF 4.4.4) bootloader just as the 5.1 playground
    # image did; the first (reversible) flash confirms it.
    # NOTE: the Shelly-hardware requirements -- single-core (CONFIG_FREERTOS_UNICORE),
    # IDF app-rollback disabled, the exact Shelly partition table, and the OTA
    # --wrap shims -- are ALL injected automatically by the shelly_wall_dimmer
    # component (components/shelly_wall_dimmer/__init__.py). That keeps this a
    # plain ESPHome esp-idf config: no partitions:/sdkconfig_options:/advanced:
    # keys needed here.

# UART1 to the APT32S003 dimming co-processor. PROTOCOL.md: 115200 8N1,
# single raw command bytes out, framed '$...#' status frames in.
uart:
  id: dimmer_uart
  # TX/RX confirmed from firmware disassembly (uart_set_pin trace, PROTOCOL.md):
  # ESP32 TX = GPIO21 (carries the 0xFF poll and 0x80|B commands),
  #           RX = GPIO22 (receives the '$ b0 b1 b2 #' frames).
  # This is the reverse of the naive struct-order reading -- a pin-dispatch
  # helper swaps the two bytes before uart_set_pin. If comms fail on first
  # flash, swapping these is the first thing to try.
  tx_pin: GPIO21
  rx_pin: GPIO22
  baud_rate: 115200

shelly_wall_dimmer:
  id: dimmer_coprocessor
  update_interval: 1s  # periodic CMD_POLL so temperature/state stay fresh
  # Front tactile button ("key" net). Handled in the component, not by
  # `binary_sensor: platform: gpio` -- that platform samples the pin's LEVEL in
  # loop() and silently drops a tap shorter than one loop iteration, so quick
  # taps do nothing. This latches the press EDGE in the ISR instead, so a tap of
  # any length toggles exactly once. A press also gets the setpoint assert (see
  # "Assert Duration" below). Do NOT also point a gpio binary_sensor at GPIO4.
  button_pin:
    number: GPIO4
    # No ESP32 internal pull -- the board provides an external pull.
    mode:
      input: true
    inverted: true  # BENCH-VERIFY (1): active-low starting guess
  # First-flash helper: build the stock-format Shelly OTA "bridge" zip on every
  # successful compile (from build artifacts only -- no Shelly blobs). Add
  # `push_to:` with the device IP to also serve it and trigger Shelly.Update on
  # that device right after the build. Only needed for the very first flash onto
  # a stock dimmer; after that, updates go over ESPHome-native OTA. See README.
  # bridge_package:
  #   push_to: 192.168.10.81

light:
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    # id for your own automations. The front button does NOT need it -- the
    # component toggles this light directly (see `button_pin:` above).
    id: dimmer_light
    name: "Light"
    # The co-processor takes LINEAR 0-100% and applies its own dimming curve,
    # so ESPHome's default gamma (2.8) is a double-correction that crushes low
    # levels to 0 (5% -> ~0). Pass brightness through linearly.
    gamma_correct: 0
    # Our engine owns the ramp/kick; ESPHome's transition would fight it by
    # streaming its own interpolated write_state calls. Let a set be a single
    # request into our state machine.
    default_transition_length: 0s
    # Power LED as a locator: INVERSE of the dimmer -- on when the light is OFF
    # (find the switch in the dark), off when the light is on. Fires on the
    # logical on/off edges, not per ramp step.
    on_turn_on:
      - light.turn_off: power_led
    on_turn_off:
      - light.turn_on: power_led

  # ---- status LEDs as dimmable ~1000 Hz PWM indicators --------------------
  # Both physical LEDs are driven by ledc PWM channels (see `output:` below), each
  # with its own HA brightness slider.
  #
  # Power LED: a locator, driven inverse to the dimmer by the automations above
  # (on while the dimmer is off). Its brightness slider is its own fixed "on"
  # level -- it does NOT track the dimmer's brightness. Defaults on (dimmer
  # assumed off at boot); the mirror corrects it once the dimmer reports state.
  - platform: monochromatic
    id: power_led
    name: "Power LED"
    output: power_led_pwm
    entity_category: config
    gamma_correct: 0          # slider % maps straight to PWM duty
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
  # WiFi/sys LED: a Wi-Fi/status ERROR indicator only. Off while everything is
  # healthy; blinks on AP/connecting/warning/error via the status_led_pwm
  # component (same app-state hook as ESPHome's status_led) at this light's
  # configurable brightness. The light's on/off is a master enable (on = active).
  - platform: status_led_pwm
    id: wifi_led
    name: "WiFi LED"
    output: wifi_led_pwm
    entity_category: config
    gamma_correct: 0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

# EVERY knob below is stored in NVS the moment you change it in HA, and restored
# on the next boot -- including across an OTA, which rewrites only the app
# partition. So `initial_value:` / `restore_mode:` here are FIRST-BOOT values:
# they apply to a device that has never had that entity's value stored (a fresh
# flash, or after a full-erase serial flash), and are ignored on every boot
# after that. To re-apply one, change it in HA -- editing this file will not
# override a stored value. Values shown are the component's own defaults, spelled
# out so they are easy to tune before the first flash. Full list: README.
number:
  # kick_level is the single pivot: the lowest % the bulb reliably lights at.
  # Turn-on snaps here, then dwells+ramps down (below) or ramps up (above).
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: kick_level
    name: "Kick Level"
    initial_value: 20      # 0-100 %
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: kick_dwell_ms
    name: "Kick Dwell"
    initial_value: 150     # 0-2000 ms
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: min_brightness
    name: "Min Brightness"
    initial_value: 1       # 0-100 %
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: max_brightness
    name: "Max Brightness"
    initial_value: 100     # 0-100 %
  # Single shared ramp rate in %/second, used by every ramp (on-change, on/off
  # fade, and limit correction). The firmware quantizes it to a step cadence.
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: ramp_rate
    name: "Ramp Rate"
    initial_value: 150     # 1-1000 %/s
  # SAFETY: above this co-processor temperature the output is switched off and
  # held off until it cools. Belt-and-suspenders in front of the TRIAC's own
  # hardware thermal cutoff -- neither the co-processor nor stock's firmware
  # acts on temperature. Measured: 25-27 C idle, ~29 C after hours at 24%;
  # typical weakest-link part ratings in this class are 85 C. 65 C errs low
  # because the number is still provisional. To characterize, sweep with your
  # heaviest fixture and dwell at MID-RANGE (~50%), which is worst case for a
  # phase-cut dimmer -- not 100%, where switching loss approaches zero.
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: overtemp_limit
    name: "Over-temp Limit"
    initial_value: 65      # 40-85 C; the firmware clamps to 85 regardless
  # ---- front button + setpoint assert ---------------------------------------
  # Minimum gap between two accepted button presses, and the window in which
  # release bounce is discarded. Raise it if one tap toggles twice; lower it if
  # fast repeated taps are being swallowed.
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: button_hold_off_ms
    name: "Button Hold Off"
    initial_value: 100     # 0-1000 ms
  # The finger that presses the button also lands on the capacitive plate, which
  # the co-processor applies to the TRIAC before we ever hear about it. A kicked
  # turn-on otherwise sends ONE strike byte and then goes quiet for the whole
  # kick dwell, so the touch position overwrites it and the bulb never strikes.
  # These re-send a button-originated command hard enough to win that race.
  # Raise the duration if a lingering finger still steals the command; raise the
  # interval if the touch LED bar flickers during the burst. Home Assistant
  # commands are never asserted -- nothing is touching the plate then.
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: assert_ms
    name: "Assert Duration"
    initial_value: 50      # 0-1000 ms; 0 disables the assert
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: assert_interval_ms
    name: "Assert Interval"
    initial_value: 5       # 1-100 ms
  # (The optional `raw_tx_byte` diagnostic number belongs here -- see
  # "RAW-SEND PROTOCOL TOOL" near the bottom of this file for both halves.)

# Switches take their first-boot value from `restore_mode:` (the standard
# ESPHome key) rather than `initial_value:` -- RESTORE_DEFAULT_ON/OFF means
# "restore what's stored, or this if nothing is". Use ALWAYS_ON / ALWAYS_OFF
# instead to pin one at every boot and opt out of persistence entirely.
switch:
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: kick_enabled
    name: "Kick Enabled"
    restore_mode: RESTORE_DEFAULT_ON
  # Ramp on a brightness change while already on (default on).
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: ramp_on_change
    name: "Ramp On Change"
    restore_mode: RESTORE_DEFAULT_ON
  # Fade in on turn-on / fade out on turn-off, instead of jumping (default off).
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: ramp_on_off
    name: "Fade In-Out"
    restore_mode: RESTORE_DEFAULT_OFF
  # If the physical touch panel drives brightness outside the min/max window,
  # ramp back to the nearest limit (default off; see the touch caveat in README).
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: limit_correct
    name: "Limit Correct"
    restore_mode: RESTORE_DEFAULT_OFF
  # SAFETY: after the first flash, the OTHER app slot still holds stock Shelly
  # firmware -- the only way back on a device with no USB. A routine wireless
  # update targets exactly that slot, so the firmware REFUSES such an OTA until
  # this is turned on. Flip it once, in HA, when you accept losing the ability
  # to revert to stock; it persists across reboots and is irrelevant afterwards
  # (once overwritten, no stock image exists to protect). See README.
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: allow_overwrite_stock
    name: "Allow Overwrite Stock"
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    name: "Temperature"

text_sensor:
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: last_frame
    name: "Last Frame"
    id: dimmer_last_frame
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: mcu_version
    name: "MCU Version"

# ---- RECOVERY BUTTONS (disabled by default) --------------------------------
# Shipped OFF because normal operation never needs them: a healthy image
# self-commits (auto-commit-on-healthy) and a bad one auto-reverts via the SH0S
# ba-countdown, with no button press. Worth enabling for a FIRST conversion of a
# hard-to-reach unit: "Boot: Revert" is the deliberate way back to stock while
# stock still occupies the other slot.
#
# This block is SELF-CONTAINED -- uncomment the whole thing and it validates.
# (The raw-send tool is separate, at the bottom of this file, because it needs a
# matching `number:` entry.)
#
# Read-only, safe to press anytime:
#   Boot: Log         -- decode both otadata copies (as/rs/ba/committed).
#   Dump Boot State   -- hex-dump raw otadata to the log.
# ONE-SHOT FLASH WRITE each (to the non-winning otadata copy; the
# partition-layout guard refuses them on an unrecognized flash map -- still,
# press "Boot: Log" and sanity-check the decode first):
#   Boot: Commit      -- make the running slot permanent now.
#   Boot: Revert      -- point the next boot at the other slot (stock, until
#                        your second flash overwrites it).
#
# button:
#   - platform: template
#     name: "Dump Boot State"
#     entity_category: diagnostic
#     on_press:
#       - lambda: 'id(dimmer_coprocessor).dump_boot_state();'
#   - platform: template
#     name: "Boot: Log"
#     entity_category: diagnostic
#     on_press:
#       - lambda: 'id(dimmer_coprocessor).log_boot_state();'
#   - platform: template
#     name: "Boot: Commit"
#     entity_category: diagnostic
#     on_press:
#       - lambda: 'id(dimmer_coprocessor).commit_boot_state();'
#   - platform: template
#     name: "Boot: Revert"
#     entity_category: diagnostic
#     on_press:
#       - lambda: 'id(dimmer_coprocessor).revert_boot_state_to_stock();'

# ---- RAW-SEND PROTOCOL TOOL (disabled by default) --------------------------
# Pushes one arbitrary byte at the co-processor, for sweeping the unused command
# space (0x65-0x7F / 0xE5-0xFE) from HA without reflashing. Not needed for
# installation or recovery -- this is protocol archaeology.
#
# TWO PARTS, and YAML allows only one `button:` key, so they cannot be one block.
# To enable, do BOTH:
#   1. add this entry to the `number:` section above:
#        - platform: template
#          id: raw_tx_byte
#          name: "Raw TX Byte"
#          entity_category: diagnostic
#          min_value: 0
#          max_value: 255
#          step: 1
#          mode: box
#          optimistic: true
#          initial_value: 0
#   2. add this entry to the `button:` block above (which must be uncommented):
#        - platform: template
#          name: "Send Raw Byte"
#          entity_category: diagnostic
#          on_press:
#            - lambda: |-
#                id(dimmer_coprocessor).send_raw((uint8_t) id(raw_tx_byte).state);
# Enabling only part 2 fails with: Couldn't find ID 'raw_tx_byte'.

# ---- v1 LOCAL CONTROL: front button + status LEDs -------------------------
# GPIOs confirmed from stock app disassembly.
#   (1) BUTTON ACTIVE LEVEL -- STILL TO BENCH-VERIFY. `inverted: true` on
#       `button_pin:` above assumes active-low (button to GND + external board
#       pullup, the near-certain wiring). If a tap toggles on RELEASE rather
#       than on press, flip `inverted`. Note the component attaches a LOGICAL
#       rising-edge interrupt, so `inverted` is the only polarity knob -- it
#       flips both the edge and the re-arm read together.
#   (2) LED ACTIVE LEVEL -- RESOLVED on a real unit: both LEDs are active-low,
#       so the ledc outputs above set `inverted: true`. The wifi(GPIO33)/
#       power(GPIO25) ASSIGNMENT is still circumstantial; if the two behave as
#       though swapped, exchange the pin numbers. Cosmetic only, never harmful.

binary_sensor:
  # Goes `problem` when the over-temp cutout has switched the output off.
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: overtemp
    name: "Over-temperature"
  # Front tactile button ("key" net) on GPIO4 -- see `button_pin:` above, which
  # is where the pin is configured and where the toggle is actually performed.
  # This entity only makes presses VISIBLE in Home Assistant; adding it is
  # optional and removing it does not disable the button. It is a debounced
  # PULSE, not a live view of the contact: true when a press is accepted, false
  # when the button re-arms. An `on_press:` here runs IN ADDITION to the
  # built-in toggle, so do not put `light.toggle` in one.
  - platform: shelly_wall_dimmer
    shelly_wall_dimmer_id: dimmer_coprocessor
    type: button
    name: "Button"

output:
  # Status-LED PWM channels at ~1000 Hz (ledc). Brightness + on/off both come
  # from the monochromatic lights above.
  #
  # BENCH-CONFIRMED on a real unit: both LEDs are ACTIVE-LOW -- the pin sinks
  # the LED, so a 0% duty lit them fully and 100% turned them off. `inverted:
  # true` is applied at the PIN, which ledc honours by flipping the duty
  # (state = 1 - state), so the HA brightness sliders keep meaning what they say:
  # 0% = dark, 100% = full. Inverting at the light/output layer instead would
  # have made the sliders read backwards.
  - platform: ledc
    id: power_led_pwm
    pin:
      number: GPIO25
      inverted: true
    frequency: 1000Hz
  - platform: ledc
    id: wifi_led_pwm
    pin:
      number: GPIO33
      inverted: true
    frequency: 1000Hz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if the configured WiFi can't be joined -- so a bad-WiFi
  # image is ALWAYS reachable (the gap that stranded the first flash).
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

# WiFi-setup portal served on the fallback AP.
captive_portal:

api:
  encryption:
    key: !secret encryption_key

# Native ESPHome OTA is SH0S-SAFE here: the shelly_wall_dimmer component adds a
# linker --wrap on esp_ota_set_boot_partition (dfu_wrap.cpp), so an OTA writes
# the Shelly SH0S boot record (boot new slot, ba-countdown auto-revert to the
# current slot on failure) instead of ota_select. IDF app-rollback is disabled
# above so no other otadata write happens. A healthy new image self-commits
# (auto-commit-on-healthy in the component). Do NOT re-enable IDF rollback.
ota:
  - platform: esphome
    password: !secret ota_password

# Co-processor UART lives on UART1 (dimmer_uart above); the logger stays on
# the default UART0/USB-serial console, so it never contends with the
# protocol link.
logger:
  # DEBUG shows everything printed at boot (dump_config is an internal CONFIG
  # level below DEBUG; INFO would wrongly hide it) while our component adds no
  # periodic DEBUG logging -- only an on-change write_state trace.
  #
  # NOTE: the once-per-second "'Dimmer Temperature' >> 25 °C" / "'Dimmer Last
  # Raw Frame' >> ..." lines are NOT logger output -- they are ENTITY STATE
  # updates ([S] in the log view), sent on every publish_state() call
  # regardless of log level. They are silenced at the source in
  # handle_status_frame_() (publish telemetry only on change), not here.
  level: DEBUG
